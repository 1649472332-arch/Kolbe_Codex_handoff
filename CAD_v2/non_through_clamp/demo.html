<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kolbe 非贯穿夹紧 — 装配演示</title>
<style>
  html, body { margin:0; height:100%; background:#0e1114; color:#e8eaed; font-family:system-ui,sans-serif; }
  #c { position:fixed; inset:0; }
  #hud {
    position:fixed; left:12px; top:12px; z-index:2;
    background:rgba(20,24,28,.88); border:1px solid #333; border-radius:10px;
    padding:12px 14px; max-width:340px; backdrop-filter:blur(6px);
  }
  #hud h1 { font-size:14px; margin:0 0 6px; font-weight:600; }
  #hud p { font-size:12px; margin:0 0 8px; opacity:.85; line-height:1.4; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  button {
    background:#2a3139; color:#eee; border:1px solid #445; border-radius:7px;
    padding:6px 10px; font-size:12px; cursor:pointer;
  }
  button:hover { background:#3a4550; }
  button.active { background:#3d6b4f; border-color:#5a9; }
  #hint { position:fixed; right:12px; bottom:12px; font-size:11px; opacity:.55; z-index:2; }
</style>
</head>
<body>
<div id="hud">
  <h1>非贯穿螺栓压滤式 Kolbe 外壳</h1>
  <p>端板夹紧 · 中间框无螺栓孔 · 舌槽对位<br/>拖拽旋转 · 滚轮缩放 · 右键平移</p>
  <div class="row">
    <button id="btnExplode" type="button">爆炸视图</button>
    <button id="btnReset" type="button">复位</button>
    <button id="btnSpin" type="button">自动旋转</button>
  </div>
  <div class="row">
    <button id="btnLabels" type="button" class="active">图层说明</button>
  </div>
  <p id="status" style="margin-top:8px;font-size:11px;opacity:.7"></p>
</div>
<div id="hint">尺寸对齐 version2 量级 · 概念演示 · 压力/密封未验证</div>
<canvas id="c"></canvas>

<!-- three.js r128 + OrbitControls (CDN). 几何为程序化简化，不依赖 STL，可直接打开本文件。 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  // --- Parameters matching kolbe_non_through.scad defaults (mm) ---
  const P = {
    frameW: 74, frameH: 82, frameT: 4,
    endW: 96, endH: 106, endT: 20,
    windowW: 43, windowH: 63,
    elecW: 28, elecH: 28, elecT: 1,
    tabW: 8, tabL: 22,
    nestInset: 4, nestTW: 3.8, nestTL: 11, nestTH: 0.9,
    nestGW: 4.2, nestGL: 11.4, nestGD: 1.05,
    boltPts: [[42,47],[-42,47],[42,-47],[-42,-47],[42,0],[-42,0]],
    portY: 27, portBossH: 8, portBossR: 7,
    frames: 3, electrodes: 3,
    explodeGap: 16
  };

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x0e1114, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 2, 1, 2000);
  camera.position.set(140, 110, 160);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.target.set(0, 25, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const L1 = new THREE.DirectionalLight(0xffffff, 0.75);
  L1.position.set(80, 120, 60); scene.add(L1);
  const L2 = new THREE.DirectionalLight(0x88aaff, 0.25);
  L2.position.set(-60, -40, -80); scene.add(L2);

  const root = new THREE.Group();
  scene.add(root);

  // Materials
  const matEnd = new THREE.MeshStandardMaterial({ color: 0x1a1d22, metalness: 0.2, roughness: 0.65 });
  const matFrame = new THREE.MeshStandardMaterial({ color: 0x2a2e35, metalness: 0.1, roughness: 0.7 });
  const matElec = new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.7, roughness: 0.35 });
  const matElecAlt = new THREE.MeshStandardMaterial({ color: 0x8a93a0, metalness: 0.6, roughness: 0.4 });
  const matBolt = new THREE.MeshStandardMaterial({ color: 0xa8adb5, metalness: 0.85, roughness: 0.3 });
  const matTongue = new THREE.MeshStandardMaterial({ color: 0x3d6b4f, metalness: 0.1, roughness: 0.55 });
  const matGroove = new THREE.MeshStandardMaterial({ color: 0x5a3040, metalness: 0.1, roughness: 0.55 });
  const matBoss = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, metalness: 0.7, roughness: 0.35 });

  function roundedBox(w, h, t, r, mat) {
    // Approximate with box (demo); corner radius ignored for speed
    const g = new THREE.BoxGeometry(w, h, t);
    const m = new THREE.Mesh(g, mat);
    return m;
  }

  function frameMesh() {
    const g = new THREE.Group();
    // Outer plate with window via CSG-less trick: four border boxes
    const t = P.frameT, w = P.frameW, h = P.frameH, ww = P.windowW, wh = P.windowH;
    const landX = (w - ww) / 2, landY = (h - wh) / 2;
    const parts = [
      [w, landY, 0, (h - landY) / 2],
      [w, landY, 0, -(h - landY) / 2],
      [landX, wh, (w - landX) / 2, 0],
      [landX, wh, -(w - landX) / 2, 0]
    ];
    for (const [bw, bh, x, y] of parts) {
      const m = roundedBox(bw, bh, t, 0, matFrame);
      m.position.set(x, y, 0);
      g.add(m);
    }
    // Tongues on +Z (green)
    addNestKeys(g, P.nestTH, +t / 2 + P.nestTH / 2, matTongue, true);
    // Groove markers on -Z (recessed dark markers)
    addNestKeys(g, P.nestGD * 0.5, -t / 2 + P.nestGD * 0.25, matGroove, false);
    g.userData.kind = 'frame';
    return g;
  }

  function addNestKeys(parent, keyT, z, mat, isTongue) {
    const inset = P.nestInset;
    const cx = P.frameW / 2 - inset, cy = P.frameH / 2 - inset;
    const specs = [
      [cx, 0, P.nestTL, P.nestTW, Math.PI / 2],
      [-cx, 0, P.nestTL, P.nestTW, Math.PI / 2],
      [0, cy, P.nestTL, P.nestTW, 0],
      [0, -cy, P.nestTL, P.nestTW, 0]
    ];
    const lw = isTongue ? P.nestTL : P.nestGL;
    const ww = isTongue ? P.nestTW : P.nestGW;
    for (const [x, y, , , rot] of specs) {
      const m = roundedBox(lw, ww, keyT, 0, mat);
      m.position.set(x, y, z);
      m.rotation.z = rot;
      parent.add(m);
    }
  }

  function endplate(front) {
    const g = new THREE.Group();
    const body = roundedBox(P.endW, P.endH, P.endT, 0, matEnd);
    g.add(body);
    if (front) {
      // Tongues on inner (+Z local after placement)
      const tg = new THREE.Group();
      addNestKeys(tg, P.nestTH, P.endT / 2 + P.nestTH / 2, matTongue, true);
      g.add(tg);
      // Port bosses on outer face
      for (const sy of [-1, 1]) {
        const boss = new THREE.Mesh(
          new THREE.CylinderGeometry(P.portBossR, P.portBossR, P.portBossH, 24),
          matBoss
        );
        boss.rotation.x = Math.PI / 2;
        boss.position.set(0, sy * P.portY, -P.endT / 2 - P.portBossH / 2);
        g.add(boss);
      }
      // Through-bolt holes (visual cylinders cut look via dark inserts)
      for (const [x, y] of P.boltPts) {
        const hole = new THREE.Mesh(
          new THREE.CylinderGeometry(3.3, 3.3, P.endT + 0.2, 16),
          new THREE.MeshStandardMaterial({ color: 0x050607 })
        );
        hole.rotation.x = Math.PI / 2;
        hole.position.set(x, y, 0);
        g.add(hole);
      }
    } else {
      // Grooves on inner face
      const gg = new THREE.Group();
      addNestKeys(gg, P.nestGD * 0.55, -P.endT / 2 + P.nestGD * 0.2, matGroove, false);
      g.add(gg);
      // Heatset pockets on outer face
      for (const [x, y] of P.boltPts) {
        const pocket = new THREE.Mesh(
          new THREE.CylinderGeometry(4, 4, 8, 16),
          new THREE.MeshStandardMaterial({ color: 0x3a2a10, metalness: 0.4, roughness: 0.5 })
        );
        pocket.rotation.x = Math.PI / 2;
        pocket.position.set(x, y, P.endT / 2 - 4);
        g.add(pocket);
      }
    }
    g.userData.kind = front ? 'front' : 'rear';
    return g;
  }

  function electrode(withTab, idx) {
    const g = new THREE.Group();
    const mat = withTab ? matElec : matElecAlt;
    const body = roundedBox(P.elecW, P.elecH, P.elecT, 0, mat);
    g.add(body);
    if (withTab) {
      const tab = roundedBox(P.tabW, P.tabL, P.elecT, 0, mat);
      tab.position.set((idx - 1) * (P.tabW + 2), P.elecH / 2 + P.tabL / 2 - 0.5, 0);
      g.add(tab);
    }
    g.userData.kind = 'electrode';
    return g;
  }

  function bolt(shankLen) {
    const g = new THREE.Group();
    const shank = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, shankLen, 12), matBolt);
    shank.rotation.x = Math.PI / 2;
    shank.position.z = shankLen / 2;
    g.add(shank);
    const head = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 6, 6), matBolt);
    head.rotation.x = Math.PI / 2;
    head.position.z = -3;
    g.add(head);
    g.userData.kind = 'bolt';
    return g;
  }

  // Build stack layers along +Z (Three: Z out of screen initially; we map SCAD Z -> Three Z)
  const layerNodes = []; // {obj, zClosed, kind}

  function rebuild(explode) {
    while (root.children.length) root.remove(root.children[0]);
    layerNodes.length = 0;
    const gap = explode ? P.explodeGap : 0;
    let z = 0;

    function addLayer(obj, thick, kind) {
      obj.position.z = z + thick / 2;
      root.add(obj);
      layerNodes.push({ obj, zClosed: z + thick / 2, thick, kind });
      z += thick + gap;
    }

    addLayer(endplate(true), P.endT, 'front');

    // Frames land-to-land so nest engages; electrodes centered in each frame cavity
    for (let i = 0; i < P.frames; i++) {
      const zFrameBottom = z;
      addLayer(frameMesh(), P.frameT, 'frame');
      if (i < P.electrodes) {
        const elec = electrode(i % 2 === 0, i);
        // Place into previous frame: z currently after frame; nest electrode mid-cavity
        elec.position.z = zFrameBottom + P.frameT / 2;
        root.add(elec);
        layerNodes.push({ obj: elec, zClosed: zFrameBottom + P.frameT / 2, thick: P.elecT, kind: 'electrode' });
      }
    }

    addLayer(endplate(false), P.endT, 'rear');

    const closedTotal = P.endT * 2 + P.frames * P.frameT;
    const shank = closedTotal + 6;
    const boltGroup = new THREE.Group();
    boltGroup.userData.kind = 'bolts';
    for (const [x, y] of P.boltPts) {
      const b = bolt(shank);
      b.position.set(x, y, 0);
      boltGroup.add(b);
    }
    // Place bolt group at front outer face z=0
    // In explode mode stretch visually
    if (explode) {
      boltGroup.scale.z = (z) / closedTotal;
    }
    root.add(boltGroup);
    layerNodes.push({ obj: boltGroup, zClosed: 0, thick: 0, kind: 'bolts' });

    // Center assembly
    root.position.set(0, 0, -closedTotal / 2);
    controls.target.set(0, 0, 0);
    document.getElementById('status').textContent =
      (explode ? '爆炸视图 · ' : '装配视图 · ') +
      P.frames + ' 框 + ' + P.electrodes + ' 电极 · 6×M6 仅端板 · 舌槽对位';
  }

  let exploding = false;
  let autoSpin = false;
  rebuild(false);

  document.getElementById('btnExplode').onclick = function () {
    exploding = !exploding;
    this.classList.toggle('active', exploding);
    rebuild(exploding);
  };
  document.getElementById('btnReset').onclick = function () {
    exploding = false;
    autoSpin = false;
    document.getElementById('btnExplode').classList.remove('active');
    document.getElementById('btnSpin').classList.remove('active');
    rebuild(false);
    camera.position.set(140, 110, 160);
    controls.target.set(0, 0, 0);
    controls.update();
  };
  document.getElementById('btnSpin').onclick = function () {
    autoSpin = !autoSpin;
    this.classList.toggle('active', autoSpin);
  };
  document.getElementById('btnLabels').onclick = function () {
    this.classList.toggle('active');
    const on = this.classList.contains('active');
    matTongue.visible = on; // materials don't have visible; toggle key meshes
    root.traverse(function (o) {
      if (o.isMesh && (o.material === matTongue || o.material === matGroove)) {
        o.visible = on;
      }
    });
  };

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  (function loop() {
    requestAnimationFrame(loop);
    if (autoSpin) root.rotation.y += 0.005;
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
